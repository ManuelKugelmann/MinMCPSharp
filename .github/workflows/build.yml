name: Build

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ development, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Build Unity DLL
      run: |
        dotnet restore MCPSharp/MCPSharp.csproj -p:Configuration=Unity
        dotnet build MCPSharp/MCPSharp.csproj --configuration Unity --no-restore

    - name: Upload Unity DLL
      uses: actions/upload-artifact@v4
      with:
        name: MCPSharp.Unity
        path: MCPSharp/bin/Unity/netstandard2.0/MCPSharp.dll
