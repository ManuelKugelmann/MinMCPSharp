name: Build

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ development, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Smoke test examples
      run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName~ExampleSmokeTests"

    - name: Stage Unity package
      run: |
        mkdir -p unity-package/MinMCPSharp/Scripts
        cp MinMCPSharp/bin/Release/netstandard2.0/MinMCPSharp.dll unity-package/MinMCPSharp/
        cp MinMCPSharp/Unity/*.cs unity-package/MinMCPSharp/Scripts/

    - name: Upload Unity package
      uses: actions/upload-artifact@v4
      with:
        name: MinMCPSharp.Unity
        path: unity-package/MinMCPSharp/
