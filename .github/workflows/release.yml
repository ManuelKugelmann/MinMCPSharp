name: Release to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0 or 1.0.0-beta.1)'
        required: true
        type: string
      prerelease:
        description: 'Pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || (github.event.inputs.prerelease == 'true' && github.ref == 'refs/heads/development')

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore MinMCPSharp/MinMCPSharp.csproj

    - name: Build
      run: dotnet build MinMCPSharp/MinMCPSharp.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Pack
      run: dotnet pack MinMCPSharp/MinMCPSharp.csproj --no-build --configuration Release -p:PackageVersion=${{ github.event.inputs.version }} --output nupkgs

    # - name: Push to NuGet
    #   run: dotnet nuget push nupkgs/MinMCPSharp.${{ github.event.inputs.version }}.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

    - name: Stage Unity package
      run: |
        mkdir -p unity-package/MinMCPSharp/Scripts
        cp MinMCPSharp/bin/Release/netstandard2.0/MinMCPSharp.dll unity-package/MinMCPSharp/
        cp MinMCPSharp/Unity/*.cs unity-package/MinMCPSharp/Scripts/
        cd unity-package && zip -r ../MinMCPSharp.Unity.${{ github.event.inputs.version }}.zip MinMCPSharp/

    - name: Publish Github release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: MinMCPSharp ${{ github.event.inputs.version }}
        body: |
          Release of MinMCPSharp version ${{ github.event.inputs.version }}
        draft: false
        prerelease: ${{ github.event.inputs.prerelease }}
        files: |
          nupkgs/MinMCPSharp.${{ github.event.inputs.version }}.nupkg
          MinMCPSharp.Unity.${{ github.event.inputs.version }}.zip
